<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="baseplate">
    <main id="surface" aria-live="polite"></main>

    <div id="ptt-typed" hidden>
      <input id="typed-input" type="text" placeholder="Type a prompt and press Enter" autocomplete="off" />
    </div>

    <footer id="footer-rail" role="toolbar" aria-label="Shortcuts and actions">
      <a id="brand" href="#" aria-label="Bridge home">
        <svg id="brand-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- two nodes joined by an arc -->
          <path d="M5 22 C 12 6, 20 6, 27 22" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="5"  cy="22" r="3.2" fill="#ffffff"/>
          <circle cx="27" cy="22" r="3.2" fill="#ffffff"/>
        </svg>
        <span class="brand-name">Bridge</span>
      </a>
      <div id="shortcuts-rail" aria-label="Navigation shortcuts"></div>
      <div id="action-bar">
        <div id="primary-shortcut" aria-label="Primary action"></div>
      </div>
    </footer>
  </div>

  <aside id="file-drawer" class="drawer left" hidden>
    <header>
      <span>Files</span>
      <button id="new-folder-btn" type="button" aria-label="New folder">＋</button>
    </header>
    <div class="file-tree"></div>
  </aside>

  <div id="new-folder-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>New folder</h3>
      <input type="text" id="new-folder-name" placeholder="Folder name" autocomplete="off" />
      <div class="modal-row">
        <button type="button" id="new-folder-dictate">Dictate</button>
        <button type="button" id="new-folder-cancel">Cancel</button>
        <button type="button" id="new-folder-create">Create</button>
      </div>
    </div>
  </div>

  <aside id="file-viewer" class="drawer left wide" hidden>
    <header>
      <span class="file-viewer-path"></span>
      <button class="file-viewer-close" type="button" aria-label="Close file viewer">×</button>
    </header>
    <pre class="file-viewer-body"></pre>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>

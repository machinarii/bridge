<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="baseplate">
    <header id="context-strip">
      <span id="context-label">Bridge</span>
      <span id="listening-indicator" data-state="idle">
        <span class="dot"></span>
        <span class="state-text">Ready</span>
      </span>
    </header>

    <main id="surface" aria-live="polite"></main>

    <footer id="action-bar" role="toolbar" aria-label="Available actions"></footer>
  </div>

  <div id="ptt-typed" hidden>
    <input id="typed-input" type="text" placeholder="Type an intent and press Enter…" autocomplete="off" />
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>

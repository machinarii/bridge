<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="baseplate">
    <header id="context-strip">
      <a id="brand" href="#" aria-label="Bridge home">
        <svg id="brand-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- two nodes joined by an arc -->
          <path d="M5 22 C 12 6, 20 6, 27 22" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="5"  cy="22" r="3.2" fill="#ffffff"/>
          <circle cx="27" cy="22" r="3.2" fill="#ffffff"/>
        </svg>
        <span class="brand-name">Bridge</span>
      </a>
      <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <span id="listening-indicator" data-state="idle">
        <span class="dot"></span>
        <span class="state-text">Connected</span>
      </span>
    </header>

    <main id="surface" aria-live="polite"></main>

    <footer id="action-bar" role="toolbar" aria-label="Available actions"></footer>
  </div>

  <div id="ptt-typed" hidden>
    <input id="typed-input" type="text" placeholder="Type an intent and press Enter…" autocomplete="off" />
  </div>

  <aside id="history-drawer" class="drawer" hidden>
    <header><span>History</span><span class="hint">○ close</span></header>
    <ul class="history-list"></ul>
  </aside>

  <aside id="file-drawer" class="drawer left" hidden>
    <header><span>Files</span><span class="hint">Options · \</span></header>
    <div class="file-tree"></div>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>
